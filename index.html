<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around The U.S</title>
    <link href="./pages/index.css" rel="stylesheet" />
</head>
<body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img src="./images/logo.svg" alt="Around the U.S. Logo"/>
      </header>
      <main class="content">
        <section class="profile page__section">
            <img src="./images/jacques-cousteau.jpg" alt="Avatar" class="profile__image"/>
            <div class="profile__info">
                <h1 class="profile__title">Jacques-Cousteau</h1>
                <button class="profile__edit-button" type="button"></button>
                <p class="profile__description">Explorer</p>
            </div>
            <button class="profile__add-button" type="button"></button>
        </section>
        <section class="cards page__section">
            <ul class="cards__list">
                <li class="card">
                    <img src="./images/yosemite-valley.png" class="card__image" alt="Scenic view of Yosemite Valley">
                    <div class="card__description">
                        <h2 class="card__title">Yosemite Valley</h2>
                        <button class="card__like-button" type="button"></button>
                    </div>
                </li>
                <li class="card">
                    <img src="./images/lake-louise.png" class="card__image" alt="Lake Louise surrounded by mountains">
                    <div class="card__description">
                        <h2 class="card__title">Lake Loise</h2>
                        <button class="card__like-button" type="button"></button>
                    </div>
                </li>
                <li class="card">
                    <img src="./images/bald-mountains.png" class="card__image" alt="Sunset view of Bald Mountains">
                    <div class="card__description">
                        <h2 class="card__title">Bald Mountains</h2>
                        <button class="card__like-button" type="button"></button>
                    </div>
                </li><li class="card">
                    <img src="./images/latemar.png" class="card__image" alt="Night sky view at Latemar mountains">
                    <div class="card__description">
                        <h2 class="card__title">Latemar</h2>
                        <button class="card__like-button" type="button"></button>
                    </div>
                </li><li class="card">
                    <img src="./images/vanoise-national-park.png" class="card__image" alt="Vanoise National Park mountain and lake landscape">
                    <div class="card__description">
                        <h2 class="card__title">Vanoise National Park</h2>
                        <button class="card__like-button" type="button"></button>
                    </div>
                </li><li class="card">
                    <img src="./images/lago-di-braies.png" class="card__image" alt="Lago di Braise with boats on the water tied to the dock">
                    <div class="card__description">
                        <h2 class="card__title">Lago di Braise</h2>
                        <button class="card__like-button" type="button"></button>
                    </div>
                </li>
            </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__text">© 2022 Around The U.S.</p>
      </footer>
    </div>
</body>
</html>
